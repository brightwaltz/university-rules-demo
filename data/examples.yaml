# 例題：仮想の学生と、規程から期待される結論の組。
# origin: boundary（境界値を機械的に生成）/ ai（AI が規程の本文を読んで作成）/ human（担当者が追加）
# review.verdict: unreviewed / agree（AI の結論は正しい）/ disagree（正しくない。correct_status が正解）/ unsure（判断できない）
# このファイルは scripts/generate_examples.py と画面の「確認結果を保存」が書き出す。
examples:
- id: FY-AI-01
  rule_type: first_year_credit_requirement
  origin: ai
  title: 1年次を留年し、2年間で合計35単位を修得した
  student:
    year_of_study: 2
    history:
    - academic_year: 2024
      year_of_study: 1
      other_credits: 20
    - academic_year: 2025
      year_of_study: 1
      other_credits: 15
  expected:
    status: eligible
    reason: 第1年次に在籍した2年間で合計35単位を修得しており、必要な31単位以上のため
  ai_note: 「第1年次において」が、留年して第1年次を2回過ごした場合に2年分を合算するのか、最初の1年間だけを数えるのかは、条文から決まらない。最初の1年だけなら20単位で要件を満たさない。
  review:
    verdict: unreviewed
    correct_status: null
    note: null
    reviewer: null
    reviewed_on: null
- id: FY-AI-02
  rule_type: first_year_credit_requirement
  origin: ai
  title: 3年次に編入学した（本学での第1年次の在籍がない）
  student:
    year_of_study: 3
    admission: transfer
    history: []
  expected:
    status: unknown
    reason: 編入学生には本学での第1年次がなく、本条を当てはめる場面ではないと考えられるため
  ai_note: 編入学生に本条を適用するかどうかが条文に書かれていない。適用しないのであれば、ルールに「編入学生は対象外」という節を足す必要がある。現在のルールでは0単位として「満たさない」と判定される。
  review:
    verdict: unreviewed
    correct_status: null
    note: null
    reviewer: null
    reviewed_on: null
- id: FY-AI-03
  rule_type: first_year_credit_requirement
  origin: ai
  title: 1年生の前期を終えた時点で14単位を修得している
  student:
    year_of_study: 1
    history:
    - academic_year: 2026
      year_of_study: 1
      other_credits: 14
  expected:
    status: unknown
    reason: 第1年次がまだ終わっていないため、要件を満たすかどうかはまだ決まらないため
  ai_note: 年度の途中で問われた場合に「満たしていない」と答えるのか、「まだ確定していない」と答えるのかを決める必要がある。現在のルールは、判定時点までの修得単位だけを見て「満たさない」と答える。
  review:
    verdict: unreviewed
    correct_status: null
    note: null
    reviewer: null
    reviewed_on: null
- id: FY-AI-04
  rule_type: first_year_credit_requirement
  origin: ai
  title: 1年次に28単位、2年次に1年生向けの教養科目を含めて34単位を修得した
  student:
    year_of_study: 3
    history:
    - academic_year: 2024
