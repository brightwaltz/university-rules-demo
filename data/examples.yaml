      other_credits: 28
    - academic_year: 2025
      year_of_study: 2
      courses:
      - GEN-01
      - GEN-02
      other_credits: 30
  expected:
    status: not_eligible
    reason: 第1年次に修得したのは28単位で、2年次に修得した科目は1年生向けの科目でも数えないため
  ai_note: 「第1年次において修得」を「1年次の間に修得した」と読んだ。科目の配当年次（1年生向けかどうか）で数える読み方もありうる。
